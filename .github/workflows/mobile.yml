name: Whimway mobile and backend checks

on:
  pull_request:
  push:
    branches: [main, "codex/**"]

permissions:
  contents: read

concurrency:
  group: whimway-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/mobile/package-lock.json
      - name: Install backend
        run: npm ci
      - name: Install mobile
        working-directory: apps/mobile
        run: npm ci
      - name: Backend contracts and lint
        run: |
          npm run typecheck
          npm run lint
      - name: Planner, provider, security and mobile core tests
        run: npm test
      - name: Production backend bundle
        run: npm run build
      - name: Mobile typecheck and SDK version alignment
        working-directory: apps/mobile
        run: |
          npm run typecheck
          npx expo install --check
      - name: Export iOS, Android and web JavaScript
        working-directory: apps/mobile
        env:
          EXPO_PUBLIC_API_URL: https://whimway.invalid
        run: npm run export
      - name: Retain JavaScript export for inspection
        uses: actions/upload-artifact@v7
        with:
          name: expo-javascript-export
          path: apps/mobile/dist
          retention-days: 7
  web-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm ci --prefix apps/mobile
      - run: npx playwright install --with-deps chromium
      - name: Existing browser journeys
        run: npm run test:e2e
      - name: Native screen source browser journeys
        run: npm run test:e2e:mobile
      - name: Retain failure traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: web-regression-traces
          path: |
            test-results
            test-results-mobile
          retention-days: 7
