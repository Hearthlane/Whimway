# Standalone Release guest surfaces on a disposable software-GPU CI emulator.
# This flow does not use Metro, synthetic controls, credentials or live venues.
appId: ${APP_ID || 'com.example.whimway'}
name: Standalone Android Release guest probe
tags: [native, release, guest]
---
- launchApp:
    clearState: true
    permissions:
      location: deny
      notifications: deny
- runFlow: helpers/dismiss-pixel-launcher-anr.yaml
- extendedWaitUntil:
    visible: "Where are we heading[?]"
    timeout: 120000
- extendedWaitUntil:
    visible: "^Profile(, tab, 3 of 3)?$"
    timeout: 20000
- assertVisible: "^Saved(, tab, 2 of 3)?$"
- assertNotVisible: "Use synthetic development fixtures"
- takeScreenshot: android-release-explore
- tapOn: "^Profile(, tab, 3 of 3)?$"
- extendedWaitUntil:
    visible: "Guest, with all the good stuff."
    timeout: 20000
- scrollUntilVisible:
    element: "Save my preferences"
    direction: DOWN
    timeout: 30000
- takeScreenshot: android-release-profile-scrolled
- scrollUntilVisible:
    element: "Guest, with all the good stuff."
    direction: UP
    timeout: 30000
- takeScreenshot: android-release-profile
- tapOn: "^Saved(, tab, 2 of 3)?$"
- extendedWaitUntil:
    visible: "Your next good day lives here."
    timeout: 30000
- takeScreenshot: android-release-saved
- tapOn: "^Explore(, tab, 1 of 3)?$"
- extendedWaitUntil:
    visible: "Where are we heading[?]"
    timeout: 20000
- assertNotVisible: "Use synthetic development fixtures"
