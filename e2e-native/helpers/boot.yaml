appId: ${APP_ID || 'com.example.whimway'}
---
- runFlow: cancel-stale-whimway-link.yaml
- runFlow:
    when:
      true: ${maestro.platform !== 'android' || typeof ANDROID_HOST_PREPARED === 'undefined' || ANDROID_HOST_PREPARED !== '1'}
    commands:
      - launchApp:
          clearState: true
          permissions:
            location: "${maestro.platform === 'android' ? 'deny' : 'never'}"
            notifications: "${typeof NOTIFICATION_PERMISSION === 'undefined' ? 'deny' : NOTIFICATION_PERMISSION}"
- runFlow:
    when:
      platform: Android
      true: ${typeof ANDROID_HOST_PREPARED !== 'undefined' && ANDROID_HOST_PREPARED === '1'}
    commands:
      - launchApp:
          clearState: false
          stopApp: false
          permissions:
            location: deny
            notifications: "${typeof NOTIFICATION_PERMISSION === 'undefined' ? 'deny' : NOTIFICATION_PERMISSION}"
- runFlow: dismiss-pixel-launcher-anr.yaml
- extendedWaitUntil:
    visible: "Development Build"
    timeout: 60000
- openLink: ${EXPO_DEV_URL}
- runFlow: open-whimway-link.yaml
# The first retained iOS Metro bundle took 132.9s. Bound only that platform's
# cold startup; this still fails on the actual heading rather than sleeping.
- runFlow:
    when:
      platform: iOS
    commands:
      - extendedWaitUntil:
          visible: "Where are we heading[?]"
          timeout: 300000
- runFlow:
    when:
      platform: Android
    commands:
      - extendedWaitUntil:
          visible: "Where are we heading[?]"
          timeout: 120000
- assertNotVisible: "(?s).*ERR_NOTIFICATIONS_KEYCHAIN_ACCESS.*"
- extendedWaitUntil:
    visible: "^Profile(, tab, 3 of 3)?$"
    timeout: 20000
- assertVisible: "^Saved(, tab, 2 of 3)?$"
