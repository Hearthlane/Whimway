appId: ${APP_ID || 'com.example.whimway'}
---
- runFlow: cancel-stale-whimway-link.yaml
- launchApp:
    clearState: true
    permissions:
      location: "${maestro.platform === 'android' ? 'deny' : 'never'}"
      notifications: "${typeof NOTIFICATION_PERMISSION === 'undefined' ? 'deny' : NOTIFICATION_PERMISSION}"
- runFlow: dismiss-pixel-launcher-anr.yaml
- extendedWaitUntil:
    visible: "Development Build"
    timeout: 60000
- openLink: ${EXPO_DEV_URL}
- runFlow: open-whimway-link.yaml
- extendedWaitUntil:
    visible: "Where are we heading[?]"
    timeout: 120000
- extendedWaitUntil:
    visible: "Profile"
    timeout: 20000
- assertVisible: "Saved"
