appId: ${APP_ID || 'com.example.whimway'}
---
- launchApp:
    clearState: true
    permissions:
      location: deny
      notifications: "${typeof NOTIFICATION_PERMISSION === 'undefined' ? 'deny' : NOTIFICATION_PERMISSION}"
- extendedWaitUntil:
    visible: "Development Build"
    timeout: 60000
- openLink: ${EXPO_DEV_URL}
- extendedWaitUntil:
    visible: "Where are we heading[?]"
    timeout: 120000
- extendedWaitUntil:
    visible: "Profile"
    timeout: 20000
- assertVisible: "Saved"
